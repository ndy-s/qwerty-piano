<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QWERTY Piano</title>
  </head>
  <body>
    <div id="app"></div>
    <p class="hint">
      Click/tap a key, or play with <kbd>A</kbd>–<kbd>K</kbd> (white) and
      <kbd>W</kbd> <kbd>E</kbd> <kbd>T</kbd> <kbd>Y</kbd> <kbd>U</kbd> (black).
      <kbd>Z</kbd>/<kbd>X</kbd> or the +/− buttons shift octave, <kbd>Shift</kbd>/<kbd>Ctrl</kbd>
      play one octave up/down for a single key. Scroll the piano to reach all 88 keys.
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
